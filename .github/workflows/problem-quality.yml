name: Problem Quality Benchmark

# Manual-only until the DOPPLER_TOKEN secret is present and the first smoke run
# has been validated. The runner is always a clean Linux host so results do not
# depend on a developer's OS or locally installed toolchains.
# Preprod Daytona base snapshot is configured in Doppler as
# CODEGYM_BASE_SNAPSHOT=codegym-base-v4.
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Run only the Python regression case'
        type: boolean
        default: true
      skip_generation:
        description: 'Debug mode: skip model call and assess saved reference only'
        type: boolean
        default: false
      baseline_kind:
        description: 'Generation baseline kind'
        type: choice
        options: [current, independent, other]
        default: current
      model_revision:
        description: 'Baseline model revision'
        type: string
        default: ''
      prompt_revision:
        description: 'Baseline prompt revision'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    name: Run problem-quality benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install Doppler CLI
        run: curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Require Doppler token
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN is required for the problem-quality benchmark"
            exit 1
          fi

      - name: Restore budget ledger
        uses: actions/cache@v4
        with:
          path: budget
          key: problem-quality-budget-${{ github.run_id }}
          restore-keys: |
            problem-quality-budget-

      - name: Run benchmark
        id: benchmark
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SMOKE: ${{ inputs.smoke }}
          SKIP_GENERATION: ${{ inputs.skip_generation }}
          BASELINE_KIND: ${{ inputs.baseline_kind || 'current' }}
          MODEL_REVISION: ${{ inputs.model_revision || '' }}
          PROMPT_REVISION: ${{ inputs.prompt_revision || '' }}
          PQ_BUDGET_STATE: ${{ github.workspace }}/budget/problem-quality-budget.json
        run: |
          doppler run -p codegym -c stg -- bash ./scripts/problem-quality-preprod.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem-quality-report-${{ steps.benchmark.outputs.run_id }}
          path: benchmark-results/preprod/
          if-no-files-found: warn

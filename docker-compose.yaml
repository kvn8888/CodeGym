services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./problems:/app/problems:ro
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CODEGYM_PORT=8080
      - CODEGYM_DB_PATH=/app/data/codegym.db
      - CODEGYM_PROBLEMS_DIR=/app/problems
      - CODEGYM_JWT_SECRET=${CODEGYM_JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - frontend

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "3000:80"

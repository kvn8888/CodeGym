name: OpenAPI Contract Lint

# Validates api/openapi.yaml with Redocly so frontend/backend contract drift
# is caught before merge (issue #23).

on:
  push:
    branches: [codegym-v2]
    paths:
      - 'api/**'
      - '.github/workflows/openapi-lint.yml'
  pull_request:
    branches: [codegym-v2, "feat/**", "fix/**", "perf/**", "ui/**"]
    paths:
      - 'api/**'
      - '.github/workflows/openapi-lint.yml'

permissions:
  contents: read

concurrency:
  group: openapi-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint OpenAPI contract
        run: npm run api:lint
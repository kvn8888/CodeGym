openapi: 3.1.0
info:
  title: CodeGym API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: >
    Initial contract for the CodeGym v2 frontend and Go backend integration.
    The backend currently wraps every JSON response in a `{ data, error }`
    envelope.
servers:
  - url: /
    description: Same-origin frontend proxy
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check backend liveness.
      security: []
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /ready:
    get:
      operationId: getReadiness
      summary: Check backend readiness.
      description: >
        Returns success in in-memory mode. When Postgres is configured through
        NEON_CONNECTION_STRING or DATABASE_URL, this endpoint verifies database
        connectivity and returns 503 if the dependency is unavailable.
      security: []
      responses:
        "200":
          description: Backend dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"
        "503":
          description: Backend dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's account profile.
      responses:
        "200":
          description: User profile loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated user's editable account profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileInput"
      responses:
        "200":
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cost:
    get:
      operationId: getGenAICost
      summary: Aggregate GenAI token usage and estimated USD cost for the authenticated workspace user.
      description: |
        Totals tokens_in / tokens_out and estimated cost from recorded generation
        calls (MCQ generation, memory profile synthesis, etc.). Costs use a built-in rate
        card (USD per million tokens) last reviewed 2026-07-15 for Meta Muse Spark,
        Azure/OpenAI GPT-5.6 Terra family, and Gemini Flash-class models.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Cost aggregate loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostAggregateEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/profile:
    get:
      operationId: getMemoryProfile
      summary: Get the authenticated user's memory profile for the selected workspace scope.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Memory profile loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/profile/refresh:
    post:
      operationId: refreshMemoryProfile
      summary: Synthesize and persist the authenticated user's memory profile from deterministic event evidence.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Memory profile refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/events:
    get:
      operationId: listMemoryEvents
      summary: List append-only memory events for the authenticated user and workspace scope.
      description: Returns events newest-first by occurrence time. All timestamps include an explicit UTC offset.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Memory events loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEventsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: recordMemoryEvent
      summary: Append a memory event for the authenticated user and workspace scope.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMemoryEventInput"
      responses:
        "201":
          description: Memory event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List practice sessions for the authenticated user and workspace scope.
      description: Returns history summaries only; state snapshots and draft files are excluded.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionKind"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: RFC3339 last_activity_at cursor; returns sessions before this timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Session summaries loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummariesEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createSession
      summary: Create a resumable practice session.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSession
      summary: Get one practice session for resume.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Session detail loaded. Workspace sessions include draft files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateSession
      summary: Update a practice session title, status, or resume state.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionInput"
      responses:
        "200":
          description: Session updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sessions/{id}/files:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    put:
      operationId: upsertSessionFiles
      summary: Batch upsert draft files for a workspace session.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSessionFilesInput"
      responses:
        "200":
          description: Session files updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/generate:
    post:
      operationId: generateContent
      summary: Generate practice content (MCQ sets today; problems and interviews later) personalized by the caller's memory profile.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Content generated and validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateMCQEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "501":
          description: The requested generation kind is not implemented yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The model provider failed or returned unusable output after the retry budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Generation is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/memory/profile/maintain:
    post:
      operationId: maintainMemoryProfile
      summary: Run structured LLM profile synthesis after a completed practice set.
      description: Interprets bounded deterministic event evidence into the summary, strengths, growth edges, skills, and durable notes used by subsequent generation.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintainProfileInput"
      responses:
        "200":
          description: The latest successfully synthesized profile, or the preserved fallback profile when generation is unavailable or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/notes/maintain:
    post:
      deprecated: true
      operationId: maintainMemoryNotes
      summary: Compatibility alias for full memory profile maintenance.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintainProfileInput"
      responses:
        "200":
          description: Latest memory profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dev-token-or-jwt

  parameters:
    WorkspaceHeader:
      name: X-CodeGym-Workspace-ID
      in: header
      required: false
      description: >
        Optional workspace-scope override. Product flows should normally omit it
        so the backend uses the authenticated principal's default personal
        workspace. The legacy header name X-CodeGym-Tenant-ID is still accepted
        by the server for compatibility.
      schema:
        type: string
        example: personal-kevin
    SessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: sess_0123456789abcdef

  responses:
    BadRequest:
      description: Request body is invalid or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, malformed, or rejected bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkspaceForbidden:
      description: Authenticated user does not have access to the requested workspace scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Requested resource was not found in the authenticated workspace scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Backend failed while processing the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: unauthenticated
        message:
          type: string
          example: Missing bearer token.

    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: "null"
        error:
          $ref: "#/components/schemas/ApiError"

    HealthEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/HealthStatus"
        error:
          type: "null"

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadinessEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/ReadinessStatus"
        error:
          type: "null"

    ReadinessStatus:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          example: ok
        mode:
          type: string
          enum: [memory, postgres]
          example: postgres

    UserProfileEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
        error:
          type: "null"

    CostAggregateEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/CostAggregate"
        error:
          type: "null"

    CostAggregate:
      type: object
      required:
        - currency
        - pricing_as_of
        - total_tokens_in
        - total_tokens_out
        - total_cost_usd
        - call_count
        - by_provider
        - by_model
        - rates
      properties:
        currency:
          type: string
          example: USD
        pricing_as_of:
          type: string
          example: "2026-07-15"
        total_tokens_in:
          type: integer
          format: int64
        total_tokens_out:
          type: integer
          format: int64
        total_cost_usd:
          type: number
          format: double
        call_count:
          type: integer
        by_provider:
          type: array
          items:
            $ref: "#/components/schemas/CostProviderSlice"
        by_model:
          type: array
          items:
            $ref: "#/components/schemas/CostModelSlice"
        rates:
          type: array
          items:
            $ref: "#/components/schemas/CostRate"

    CostProviderSlice:
      type: object
      required: [provider, tokens_in, tokens_out, cost_usd, call_count]
      properties:
        provider:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
        call_count:
          type: integer

    CostModelSlice:
      type: object
      required: [provider, model, tokens_in, tokens_out, cost_usd, call_count]
      properties:
        provider:
          type: string
        model:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
        call_count:
          type: integer

    CostRate:
      type: object
      required: [provider, input_usd_per_mtok, output_usd_per_mtok]
      properties:
        provider:
          type: string
        model_match:
          type: string
        input_usd_per_mtok:
          type: number
          format: double
        output_usd_per_mtok:
          type: number
          format: double
        source:
          type: string

    UserProfile:
      type: object
      required:
        - user_id
        - email
        - display_name
        - display_name_source
        - default_workspace_id
      properties:
        user_id:
          type: string
          example: auth0|user_123
        email:
          type: string
          example: kevin@example.com
        display_name:
          type: string
          example: Kevin Chen
        display_name_source:
          type: string
          enum: [oauth, user, fallback]
          description: >
            Where the current display name came from. `oauth` is seeded from
            the Auth0/Google name claim; `user` means the Settings page saved a
            manual override; `fallback` means no provider name was available.
        default_workspace_id:
          type: string
          description: Internal default personal workspace ID.
          example: personal-auth0-user-123

    UpdateUserProfileInput:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          example: Kevin Chen

    MemoryProfileEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/MemoryProfile"
        error:
          type: "null"

    MemoryEventsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEvent"
        error:
          type: "null"

    MemoryEventEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/MemoryEvent"
        error:
          type: "null"

    SessionSummariesEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        error:
          type: "null"

    SessionEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/Session"
        error:
          type: "null"

    MemoryProfile:
      type: object
      required:
        - summary
        - updated_at
        - next_review_at
        - strengths
        - growth_edges
        - skills
        - notes
      properties:
        summary:
          type: string
        updated_at:
          type: string
          format: date-time
        next_review_at:
          type: string
          format: date-time
        strengths:
          type: array
          items:
            type: string
        growth_edges:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProficiency"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/MemoryNote"
        provenance:
          $ref: "#/components/schemas/MemoryProfileProvenance"

    MemoryProfileProvenance:
      type: object
      required: [schema_version, trigger, provider, model, synthesized_at, evidence_through, event_count]
      properties:
        schema_version:
          type: integer
        trigger:
          type: string
          enum: [manual, daily, set-completion]
        provider:
          type: string
        model:
          type: string
        synthesized_at:
          type: string
          format: date-time
        evidence_through:
          type: string
          format: date-time
        event_count:
          type: integer
          minimum: 0

    SkillProficiency:
      type: object
      required: [id, label, area, level, confidence, trend, last_practiced]
      properties:
        id:
          type: string
        label:
          type: string
        area:
          type: string
        level:
          type: integer
        confidence:
          type: integer
        trend:
          type: string
          enum: [up, flat, down]
        last_practiced:
          type: string
          format: date-time

    MemoryNote:
      type: object
      required: [id, problem_id, title, summary, created_at, tags, action]
      properties:
        id:
          type: string
        problem_id:
          type: string
        title:
          type: string
        summary:
          type: string
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        action:
          type: string
          enum: [keep, review, prune]

    MemoryEvent:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - source
        - type
        - summary
        - occurred_at
        - created_at
      properties:
        id:
          type: string
          example: mem_evt_0123456789abcdef
        workspace_id:
          type: string
          description: Personal workspace scope ID.
        user_id:
          type: string
        source:
          type: string
          example: memory
        type:
          type: string
          example: note_created
        summary:
          type: string
        payload:
          $ref: "#/components/schemas/JsonValue"
        occurred_at:
          type: string
          format: date-time
          description: Actual event occurrence time, serialized with an explicit UTC offset.
        created_at:
          type: string
          format: date-time
          description: Persistence time, serialized with an explicit UTC offset.

    RecordMemoryEventInput:
      type: object
      required: [source, type, summary]
      properties:
        source:
          type: string
          minLength: 1
          example: generate
        type:
          type: string
          minLength: 1
          example: problem_generated
        summary:
          type: string
        payload:
          $ref: "#/components/schemas/JsonValue"
        occurred_at:
          type: string
          format: date-time
          description: Defaults to server time when omitted or zero.

    SessionKind:
      type: string
      enum: [workspace, mcq, interview]

    SessionStatus:
      type: string
      enum: [active, completed, abandoned]

    SessionSummary:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - kind
        - status
        - title
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: string
          example: sess_0123456789abcdef
        workspace_id:
          type: string
          description: Personal workspace scope ID.
        user_id:
          type: string
        kind:
          $ref: "#/components/schemas/SessionKind"
        status:
          $ref: "#/components/schemas/SessionStatus"
        title:
          type: string
        problem_id:
          type: string
        generation_job_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Session:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          required: [state]
          properties:
            state:
              $ref: "#/components/schemas/JsonValue"
            files:
              type: array
              items:
                $ref: "#/components/schemas/SessionFile"

    SessionFile:
      type: object
      required: [file_path, content, updated_at]
      properties:
        file_path:
          type: string
          example: main.go
        content:
          type: string
        updated_at:
          type: string
          format: date-time

    CreateSessionInput:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SessionKind"
        title:
          type: string
        problem_id:
          type: string
        generation_job_id:
          type: string
        state:
          $ref: "#/components/schemas/JsonValue"

    UpdateSessionInput:
      type: object
      properties:
        title:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        state:
          $ref: "#/components/schemas/JsonValue"

    UpsertSessionFilesInput:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [file_path, content]
            properties:
              file_path:
                type: string
              content:
                type: string

    GenerateInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [mcq, problem, interview]
          description: Generation kind. Only "mcq" is implemented today.
        spec:
          $ref: "#/components/schemas/MCQSpec"

    MCQSpec:
      type: object
      properties:
        topic:
          type: string
          description: Coarse topic; empty spreads questions across growth edges.
          example: hash tables
        prompt:
          type: string
          maxLength: 500
          description: The user's free-text "what do you want to study?" ask; steers concept selection together with memory notes.
          example: I want to drill Go concurrency patterns
        count:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        difficulty:
          type: string
          example: medium
        round:
          type: integer
          minimum: 0
          description: Round number in a continuous marathon; later rounds avoid repeating earlier questions.

    MaintainProfileInput:
      type: object
      properties:
        session_id:
          type: string
          description: Highlights the just-completed practice set inside the bounded cross-session evidence digest.
          example: mcq_abc123_r2

    MCQQuestion:
      type: object
      required: [id, text, options, correctIndex, concept, helpContent]
      properties:
        id:
          type: string
          example: mq1
        text:
          type: string
        options:
          type: array
          items:
            type: string
          minItems: 4
          maxItems: 4
        correctIndex:
          type: integer
          minimum: 0
          maximum: 3
        concept:
          type: string
        helpContent:
          type: string

    GenerateMCQResult:
      type: object
      required: [kind, questions, provider, model]
      properties:
        kind:
          type: string
          example: mcq
        questions:
          type: array
          items:
            $ref: "#/components/schemas/MCQQuestion"
        provider:
          type: string
          example: openai_compat
        model:
          type: string
          example: anthropic/claude-haiku-4.5

    GenerateMCQEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/GenerateMCQResult"
        error:
          type: "null"

    JsonValue:
      oneOf:
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: "null"

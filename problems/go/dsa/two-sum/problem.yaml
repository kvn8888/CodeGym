version: "1"
id: "two-sum"
title: "Two Sum"
description: |
  Given an array of integers `nums` and an integer `target`, return the indices
  of the two numbers such that they add up to `target`.

  You may assume that each input would have exactly one solution, and you may
  not use the same element twice.

  You can return the answer in any order.

  ## Examples

  **Example 1:**
  ```
  Input: nums = [2, 7, 11, 15], target = 9
  Output: [0, 1]
  Explanation: nums[0] + nums[1] == 9, so we return [0, 1].
  ```

  **Example 2:**
  ```
  Input: nums = [3, 2, 4], target = 6
  Output: [1, 2]
  ```

  ## Constraints
  - 2 <= len(nums) <= 10^4
  - -10^9 <= nums[i] <= 10^9
  - Only one valid answer exists.

category: "dsa"
subcategory: "arrays"
language: "go"
difficulty: 1
tags: ["arrays", "hash-map", "two-pointer"]
estimated_minutes: 10

type: "function"

runtime:
  image: "codegym/go122"
  timeout_seconds: 10
  memory_mb: 128
  network_mode: "none"

files:
  skeleton:
    - path: "solution.go"
      entry: true
  solution:
    - path: "solution.go"
  tests:
    - path: "solution_test.go"
      runner: "go-test"

test_config:
  strategy: "unit"
  run: "go test -v -json ./..."

hints:
  - cost: 0
    text: "Consider using a hash map to store values you've already seen."
  - cost: 1
    text: "For each number, check if (target - number) exists in your hash map."

version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: codegym-v2
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(frontend)

  - package-ecosystem: gomod
    directory: /backend
    target-branch: codegym-v2
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(backend)

  - package-ecosystem: github-actions
    directory: /
    target-branch: codegym-v2
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(actions)

          $ref: "#/components/schemas/GenerateMCQResult"
        error:
          type: "null"

    ProblemGenerationSpec:
      type: object
      properties:
        topic:
          type: string
          maxLength: 500
        prompt:
          type: string
          maxLength: 500
        difficulty:
          type: string
          enum: [easy, medium, hard]

    GenerateProblemResult:
      type: object
      required: [kind, problem_id, problem, provider, model]
      properties:
        kind:
          type: string
          enum: [problem]
        problem_id:
          type: string
        problem:
          $ref: "#/components/schemas/Problem"
        provider:
          type: string
        model:
          type: string

    GenerateProblemEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/GenerateProblemResult"
        error:
          type: "null"

    JsonValue:
      oneOf:
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: "null"

openapi: 3.1.0
info:
  title: CodeGym API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: >
    Initial contract for the CodeGym v2 frontend and Go backend integration.
    The backend currently wraps every JSON response in a `{ data, error }`
    envelope.
servers:
  - url: /
    description: Same-origin frontend proxy
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check backend liveness.
      security: []
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /ready:
    get:
      operationId: getReadiness
      summary: Check backend readiness.
      description: >
        Returns success in in-memory mode. When Postgres is configured through
        NEON_CONNECTION_STRING or DATABASE_URL, this endpoint verifies database
        connectivity and returns 503 if the dependency is unavailable.
      security: []
      responses:
        "200":
          description: Backend dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"
        "503":
          description: Backend dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's account profile.
      responses:
        "200":
          description: User profile loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated user's editable account profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileInput"
      responses:
        "200":
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cost:
    get:
      operationId: getGenAICost
      summary: Aggregate GenAI token usage and estimated USD cost for the authenticated workspace user.
      description: |
        Totals tokens_in / tokens_out and estimated cost from recorded generation
        calls (MCQ generation, memory profile synthesis, etc.). Costs use a built-in rate
        card (USD per million tokens) last reviewed 2026-07-15 for Meta Muse Spark,
        Azure/OpenAI GPT-5.6 Terra family, and Gemini Flash-class models.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Cost aggregate loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostAggregateEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/profile:
    get:
      operationId: getMemoryProfile
      summary: Get the authenticated user's memory profile for the selected workspace scope.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Memory profile loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/profile/refresh:
    post:
      operationId: refreshMemoryProfile
      summary: Synthesize and persist the authenticated user's memory profile from deterministic event evidence.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Memory profile refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/events:
    get:
      operationId: listMemoryEvents
      summary: List append-only memory events for the authenticated user and workspace scope.
      description: Returns events newest-first by occurrence time. All timestamps include an explicit UTC offset.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Memory events loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEventsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: recordMemoryEvent
      summary: Append a memory event for the authenticated user and workspace scope.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMemoryEventInput"
      responses:
        "201":
          description: Memory event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List practice sessions for the authenticated user and workspace scope.
      description: Returns history summaries only; state snapshots and draft files are excluded.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionKind"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: RFC3339 last_activity_at cursor; returns sessions before this timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Session summaries loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummariesEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createSession
      summary: Create a resumable practice session.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSession
      summary: Get one practice session for resume.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Session detail loaded. Workspace sessions include draft files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateSession
      summary: Update a practice session title, status, or resume state.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionInput"
      responses:
        "200":
          description: Session updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sessions/{id}/files:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    put:
      operationId: upsertSessionFiles
      summary: Batch upsert draft files for a workspace session.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSessionFilesInput"
      responses:
        "200":
          description: Session files updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/chat/threads:
    post:
      operationId: createOrResumeChatThread
      summary: Create or resume a scoped interview or contextual-coach thread.
      description: The server resolves authoritative session, problem, question, and memory context; clients never send DOM, source files, or hidden tests.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatThreadInput"
      responses:
        "201":
          description: Active thread and its persisted transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThreadWithMessagesEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
    get:
      operationId: listChatThreads
      summary: Find chat threads within the authenticated workspace-user scope.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ChatKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ChatThreadStatus"
        - name: session_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching thread summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThreadListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"

  /api/v1/chat/threads/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatThreadID"
    get:
      operationId: listChatMessages
      summary: Restore the append-only transcript for one scoped thread.
      responses:
        "200":
          description: Transcript restored in creation order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/threads/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/ChatThreadID"
    post:
      operationId: streamChatTurn
      summary: Append one idempotent user message and stream the assistant reply.
      description: >
        Emits versioned `meta`, `delta`, `complete`, and retryable `error` SSE
        events. Reusing client_message_id replays an already completed reply
        without duplicating the user message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatTurnInput"
      responses:
        "200":
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/threads/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/ChatThreadID"
    post:
      operationId: resetChatThread
      summary: Close the current thread and create a clean successor.
      responses:
        "201":
          description: Successor thread and opening transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThreadWithMessagesEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/threads/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/ChatThreadID"
    post:
      operationId: finishInterview
      summary: Complete an interview and persist a validated coarse assessment event.
      description: Completion remains durable when best-effort memory maintenance fails.
      responses:
        "200":
          description: Completed interview, coarse assessment, and memory update status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewFinishEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/threads/{id}/exit:
    parameters:
      - $ref: "#/components/parameters/ChatThreadID"
    post:
      operationId: exitInterview
      summary: Record a compact exit event while leaving the interview resumable.
      responses:
        "200":
          description: Active interview retained for resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThreadEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow-operations:
    post:
      operationId: createWorkflowOperation
      summary: Create a durable deterministic progress operation.
      description: >
        Seeds backend-owned queued steps for MCQ generation, memory reflection,
        or the ordered next-round reflection-plus-generation workflow. The
        operation is scoped to the authenticated user and workspace.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowOperationInput"
      responses:
        "201":
          description: Scoped operation and its initial queued step events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowCreateEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"

  /api/v1/workflow-operations/{id}/events:
    parameters:
      - $ref: "#/components/parameters/WorkflowOperationID"
      - $ref: "#/components/parameters/WorkspaceHeader"
      - name: Last-Event-ID
        in: header
        required: false
        description: Last applied monotonic sequence; already-seen events are not replayed.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: after
        in: query
        required: false
        description: Query cursor equivalent to Last-Event-ID, primarily for clients that cannot set the header.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      operationId: streamWorkflowEvents
      summary: Replay and follow ordered progress events for one scoped operation.
      description: >
        Emits `progress` SSE events with an `id` equal to the event sequence.
        The stream closes after the terminal event or client disconnect.
        Events report observable product steps only—never model reasoning,
        prompts, private records, source code, secrets, or stack traces.
      responses:
        "200":
          description: Server-sent workflow event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data payload is a serialized WorkflowProgressEvent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow-operations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkflowOperationID"
      - $ref: "#/components/parameters/WorkspaceHeader"
    post:
      operationId: cancelWorkflowOperation
      summary: Mark the current observable step and operation as cancelled.
      responses:
        "200":
          description: Terminal failed operation and cancellation event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowCancelEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The operation already reached a terminal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/problems:
    get:
      operationId: listProblems
      summary: List the seeded public coding-problem catalog.
      responses:
        "200":
          description: Public problem summaries loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/problems/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: two-sum
    get:
      operationId: getProblem
      summary: Get one public coding-problem specification.
      description: Hidden tests, the execution entrypoint, and the reference solution are never returned.
      responses:
        "200":
          description: Public problem specification loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/problems/{id}/skeleton:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: two-sum
    get:
      operationId: getProblemSkeleton
      summary: Get editable starter files for one coding problem.
      responses:
        "200":
          description: Public starter files loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSkeletonEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/submissions:
    post:
      operationId: submitProblemSolution
      summary: Run a problem solution against server-only tests in Daytona.
      description: >
        The backend loads the hidden tests and execution entrypoint from the
        problem catalog. Clients send only editable solution files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProblemInput"
      responses:
        "202":
          description: Submission accepted; poll the returned submission ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Daytona execution is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/submissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: exec_run_0123456789abcdef
    get:
      operationId: getProblemSubmission
      summary: Poll one structured coding-problem submission.
      responses:
        "200":
          description: Submission status and, when complete, per-test results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/executions:
    get:
      operationId: listExecutions
      summary: List the authenticated workspace's raw execution runs.
      responses:
        "200":
          description: Execution runs loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createExecution
      summary: Run an explicit file bundle in Daytona.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitExecutionInput"
      responses:
        "201":
          description: Execution completed and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Daytona execution is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/executions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: exec_run_0123456789abcdef
    get:
      operationId: getExecution
      summary: Get one raw execution run.
      responses:
        "200":
          description: Execution run loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/practice-intakes:
    post:
      operationId: preparePracticeIntake
      summary: Prepare, resume, or explicitly restart the self-reported baseline for a normalized topic.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreparePracticeIntakeInput"
      responses:
        "200":
          description: Existing suppression or pending state, or a newly generated intake.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeIntakeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Practice intake is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: listPendingPracticeIntakes
      summary: Restore unfinished topic baselines in most-recently-updated order.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
      responses:
        "200":
          description: Pending practice intakes scoped to the authenticated workspace user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeIntakeListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/practice-intakes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updatePracticeIntake
      summary: Save partial answers immediately or mark an intake completed or skipped.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePracticeIntakeInput"
      responses:
        "200":
          description: Updated workspace-scoped intake.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeIntakeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Practice intake is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/generate:
    post:
      operationId: generateContent
      summary: Generate validated MCQ or persisted coding practice personalized by the caller's memory profile.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Content generated and validated.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GenerateMCQEnvelope"
                  - $ref: "#/components/schemas/GenerateProblemEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "409":
          description: A saved terminal result has a retryable memory update that must finish before another coding problem is generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: The requested generation kind is not implemented yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The model provider failed or returned unusable output after the retry budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Generation is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/mcq/evaluate:
    post:
      operationId: evaluateMCQFreeResponse
      summary: Grade one short free-response practice answer with the configured AI evaluator.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeResponseEvaluationInput"
      responses:
        "200":
          description: Binary correctness and concise evaluator feedback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeResponseEvaluationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "502":
          description: The evaluator provider failed or returned unusable output; the answer remains unconfirmed and retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI evaluation is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/memory/profile/maintain:
    post:
      operationId: maintainMemoryProfile
      summary: Run structured LLM profile synthesis after a completed practice set.
      description: Interprets bounded deterministic event evidence into the summary, strengths, growth edges, skills, and durable notes used by subsequent generation.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintainProfileInput"
      responses:
        "200":
          description: The latest successfully synthesized profile, or the preserved fallback profile when generation is unavailable or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/memory/notes/maintain:
    post:
      deprecated: true
      operationId: maintainMemoryNotes
      summary: Compatibility alias for full memory profile maintenance.
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintainProfileInput"
      responses:
        "200":
          description: Latest memory profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WorkspaceForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dev-token-or-jwt

  parameters:
    WorkspaceHeader:
      name: X-CodeGym-Workspace-ID
      in: header
      required: false
      description: >
        Optional workspace-scope override. Product flows should normally omit it
        so the backend uses the authenticated principal's default personal
        workspace. The legacy header name X-CodeGym-Tenant-ID is still accepted
        by the server for compatibility.
      schema:
        type: string
        example: personal-kevin
    SessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: sess_0123456789abcdef
    ChatThreadID:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: thread_0123456789abcdef
    WorkflowOperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: workflow_0123456789abcdef

  responses:
    BadRequest:
      description: Request body is invalid or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, malformed, or rejected bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkspaceForbidden:
      description: Authenticated user does not have access to the requested workspace scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Requested resource was not found in the authenticated workspace scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Backend failed while processing the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: unauthenticated
        message:
          type: string
          example: Missing bearer token.

    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: "null"
        error:
          $ref: "#/components/schemas/ApiError"

    HealthEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/HealthStatus"
        error:
          type: "null"

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadinessEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/ReadinessStatus"
        error:
          type: "null"

    ReadinessStatus:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          example: ok
        mode:
          type: string
          enum: [memory, postgres]
          example: postgres

    UserProfileEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
        error:
          type: "null"

    CostAggregateEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/CostAggregate"
        error:
          type: "null"

    CostAggregate:
      type: object
      required:
        - currency
        - pricing_as_of
        - total_tokens_in
        - total_tokens_out
        - total_cost_usd
        - call_count
        - by_provider
        - by_model
        - rates
      properties:
        currency:
          type: string
          example: USD
        pricing_as_of:
          type: string
          example: "2026-07-15"
        total_tokens_in:
          type: integer
          format: int64
        total_tokens_out:
          type: integer
          format: int64
        total_cost_usd:
          type: number
          format: double
        call_count:
          type: integer
        by_provider:
          type: array
          items:
            $ref: "#/components/schemas/CostProviderSlice"
        by_model:
          type: array
          items:
            $ref: "#/components/schemas/CostModelSlice"
        rates:
          type: array
          items:
            $ref: "#/components/schemas/CostRate"

    CostProviderSlice:
      type: object
      required: [provider, tokens_in, tokens_out, cost_usd, call_count]
      properties:
        provider:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
        call_count:
          type: integer

    CostModelSlice:
      type: object
      required: [provider, model, tokens_in, tokens_out, cost_usd, call_count]
      properties:
        provider:
          type: string
        model:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
        call_count:
          type: integer

    CostRate:
      type: object
      required: [provider, input_usd_per_mtok, output_usd_per_mtok]
      properties:
        provider:
          type: string
        model_match:
          type: string
        input_usd_per_mtok:
          type: number
          format: double
        output_usd_per_mtok:
          type: number
          format: double
        source:
          type: string

    UserProfile:
      type: object
      required:
        - user_id
        - email
        - display_name
        - display_name_source
        - default_workspace_id
      properties:
        user_id:
          type: string
          example: auth0|user_123
        email:
          type: string
          example: kevin@example.com
        display_name:
          type: string
          example: Kevin Chen
        display_name_source:
          type: string
          enum: [oauth, user, fallback]
          description: >
            Where the current display name came from. `oauth` is seeded from
            the Auth0/Google name claim; `user` means the Settings page saved a
            manual override; `fallback` means no provider name was available.
        default_workspace_id:
          type: string
          description: Internal default personal workspace ID.
          example: personal-auth0-user-123

    UpdateUserProfileInput:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          example: Kevin Chen

    MemoryProfileEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/MemoryProfile"
        error:
          type: "null"

    MemoryEventsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEvent"
        error:
          type: "null"

    MemoryEventEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/MemoryEvent"
        error:
          type: "null"

    SessionSummariesEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        error:
          type: "null"

    SessionEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/Session"
        error:
          type: "null"

    MemoryProfile:
      type: object
      required:
        - summary
        - updated_at
        - next_review_at
        - strengths
        - growth_edges
        - skills
        - notes
      properties:
        summary:
          type: string
        updated_at:
          type: string
          format: date-time
        next_review_at:
          type: string
          format: date-time
        strengths:
          type: array
          items:
            type: string
        growth_edges:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProficiency"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/MemoryNote"
        provenance:
          $ref: "#/components/schemas/MemoryProfileProvenance"

    MemoryProfileProvenance:
      type: object
      required: [schema_version, trigger, provider, model, synthesized_at, evidence_through, event_count]
      properties:
        schema_version:
          type: integer
        trigger:
          type: string
          enum: [manual, daily, set-completion]
        provider:
          type: string
        model:
          type: string
        synthesized_at:
          type: string
          format: date-time
        evidence_through:
          type: string
          format: date-time
        event_count:
          type: integer
          minimum: 0
        evidence_digest:
          type: string
          description: Stable digest of filtered profile evidence. Unchanged daily ticks skip the model call when this digest still matches.

    SkillProficiency:
      type: object
      required: [id, label, area, level, confidence, trend, last_practiced]
      properties:
        id:
          type: string
        label:
          type: string
        area:
          type: string
        level:
          type: integer
        confidence:
          type: integer
        trend:
          type: string
          enum: [up, flat, down]
        last_practiced:
          type: string
          format: date-time

    MemoryNote:
      type: object
      required: [id, problem_id, title, summary, created_at, tags, action]
      properties:
        id:
          type: string
        problem_id:
          type: string
        title:
          type: string
        summary:
          type: string
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        action:
          type: string
          enum: [keep, review, prune]

    MemoryEvent:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - source
        - type
        - summary
        - occurred_at
        - created_at
      properties:
        id:
          type: string
          example: mem_evt_0123456789abcdef
        workspace_id:
          type: string
          description: Personal workspace scope ID.
        user_id:
          type: string
        source:
          type: string
          example: memory
        type:
          type: string
          example: note_created
        summary:
          type: string
        payload:
          $ref: "#/components/schemas/JsonValue"
        occurred_at:
          type: string
          format: date-time
          description: Actual event occurrence time, serialized with an explicit UTC offset.
        created_at:
          type: string
          format: date-time
          description: Persistence time, serialized with an explicit UTC offset.

    RecordMemoryEventInput:
      type: object
      required: [source, type, summary]
      properties:
        source:
          type: string
          minLength: 1
          example: generate
        type:
          type: string
          minLength: 1
          example: problem_generated
        summary:
          type: string
        payload:
          $ref: "#/components/schemas/JsonValue"
        occurred_at:
          type: string
          format: date-time
          description: Defaults to server time when omitted or zero.

    SessionKind:
      type: string
      enum: [workspace, mcq, interview]

    SessionStatus:
      type: string
      enum: [active, completed, abandoned]

    SessionSummary:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - kind
        - status
        - title
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: string
          example: sess_0123456789abcdef
        workspace_id:
          type: string
          description: Personal workspace scope ID.
        user_id:
          type: string
        kind:
          $ref: "#/components/schemas/SessionKind"
        status:
          $ref: "#/components/schemas/SessionStatus"
        title:
          type: string
        problem_id:
          type: string
        generation_job_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Session:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          required: [state]
          properties:
            state:
              $ref: "#/components/schemas/JsonValue"
            files:
              type: array
              items:
                $ref: "#/components/schemas/SessionFile"

    SessionFile:
      type: object
      required: [file_path, content, updated_at]
      properties:
        file_path:
          type: string
          example: main.go
        content:
          type: string
        updated_at:
          type: string
          format: date-time

    CreateSessionInput:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SessionKind"
        title:
          type: string
        problem_id:
          type: string
        generation_job_id:
          type: string
        state:
          $ref: "#/components/schemas/JsonValue"

    UpdateSessionInput:
      type: object
      properties:
        title:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        state:
          $ref: "#/components/schemas/JsonValue"

    UpsertSessionFilesInput:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [file_path, content]
            properties:
              file_path:
                type: string
              content:
                type: string

    ChatKind:
      type: string
      enum: [interview, coach]

    ChatThreadStatus:
      type: string
      enum: [active, closed, completed]

    ChatMessageStatus:
      type: string
      enum: [complete, interrupted]

    InterviewMode:
      type: string
      enum: [coding, system_design, behavioral, open_coaching]

    ChatContextEnvelope:
      type: object
      required: [version, session_id]
      properties:
        version:
          type: integer
          enum: [1]
        session_id:
          type: string
        problem_id:
          type: string
        question_id:
          type: string

    ChatThread:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - session_id
        - kind
        - status
        - context
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        kind:
          $ref: "#/components/schemas/ChatKind"
        mode:
          $ref: "#/components/schemas/InterviewMode"
        status:
          $ref: "#/components/schemas/ChatThreadStatus"
        context:
          $ref: "#/components/schemas/ChatContextEnvelope"
        successor_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time

    ChatMessage:
      type: object
      required: [id, thread_id, role, content, status, created_at]
      properties:
        id:
          type: string
        thread_id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        status:
          $ref: "#/components/schemas/ChatMessageStatus"
        client_message_id:
          type: string
        reply_to_message_id:
          type: string
        created_at:
          type: string
          format: date-time

    ChatThreadWithMessages:
      allOf:
        - $ref: "#/components/schemas/ChatThread"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessage"

    CreateChatThreadInput:
      type: object
      required: [kind, session_id]
      properties:
        kind:
          $ref: "#/components/schemas/ChatKind"
        mode:
          $ref: "#/components/schemas/InterviewMode"
        session_id:
          type: string
        question_id:
          type: string

    ChatTurnInput:
      type: object
      required: [client_message_id, message]
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 8000

    InterviewAssessment:
      type: object
      required: [strengths, growth_edges, topic, mode, turn_count, duration_seconds]
      properties:
        strengths:
          type: array
          maxItems: 3
          items:
            type: string
        growth_edges:
          type: array
          maxItems: 3
          items:
            type: string
        topic:
          type: string
        mode:
          $ref: "#/components/schemas/InterviewMode"
        turn_count:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0

    InterviewFinishResult:
      type: object
      required: [thread, assessment, memory_update_status]
      properties:
        thread:
          $ref: "#/components/schemas/ChatThread"
        assessment:
          $ref: "#/components/schemas/InterviewAssessment"
        memory_update_status:
          type: string
          enum: [synced, failed]

    ChatThreadWithMessagesEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/ChatThreadWithMessages"
        error:
          type: "null"

    ChatThreadEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [thread]
          properties:
            thread:
              $ref: "#/components/schemas/ChatThread"
        error:
          type: "null"

    ChatThreadListEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [threads]
          properties:
            threads:
              type: array
              items:
                $ref: "#/components/schemas/ChatThread"
        error:
          type: "null"

    ChatMessagesEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        error:
          type: "null"

    InterviewFinishEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/InterviewFinishResult"
        error:
          type: "null"

    ProblemSummary:
      type: object
      required: [id, title, category, language, difficulty, tags, estimated_minutes, type]
      properties:
        id:
          type: string
          example: two-sum
        title:
          type: string
          example: Two Sum
        category:
          type: string
          example: algorithms
        language:
          type: string
          example: python
        framework:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          example: 1
        tags:
          type: array
          items:
            type: string
        estimated_minutes:
          type: integer
          minimum: 1
          example: 15
        type:
          type: string
          example: coding

    Problem:
      allOf:
        - $ref: "#/components/schemas/ProblemSummary"
        - type: object
          required: [version, description, runtime, files, test_config]
          properties:
            version:
              type: string
              example: "1"
            description:
              type: string
            subcategory:
              type: string
            runtime:
              $ref: "#/components/schemas/ProblemRuntime"
            files:
              $ref: "#/components/schemas/ProblemFileManifest"
            test_config:
              $ref: "#/components/schemas/ProblemTestConfig"
            hints:
              type: array
              items:
                $ref: "#/components/schemas/ProblemHint"

    ProblemRuntime:
      type: object
      required: [image, timeout_seconds, memory_mb, network_mode]
      properties:
        image:
          type: string
          example: python:3.13
        timeout_seconds:
          type: integer
          minimum: 1
          example: 20
        memory_mb:
          type: integer
          minimum: 1
          example: 256
        network_mode:
          type: string
          enum: [block-all]

    ProblemFileManifest:
      type: object
      required: [skeleton]
      properties:
        skeleton:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFileRef"

    ProblemFileRef:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: solution.py
        entry:
          type: boolean
        readonly:
          type: boolean

    ProblemTestConfig:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          example: hidden

    ProblemHint:
      type: object
      required: [cost, text]
      properties:
        cost:
          type: integer
          minimum: 0
        text:
          type: string

    SubmissionFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          example: solution.py
        content:
          type: string

    ProblemSkeleton:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionFile"

    ProblemList:
      type: object
      required: [problems, total]
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSummary"
        total:
          type: integer
          minimum: 0

    ProblemListEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/ProblemList"
        error:
          type: "null"

    ProblemEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/Problem"
        error:
          type: "null"

    ProblemSkeletonEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/ProblemSkeleton"
        error:
          type: "null"

    SubmitProblemInput:
      type: object
      required: [problem_id, files]
      properties:
        problem_id:
          type: string
          example: two-sum
        session_id:
          type: string
          example: sess_0123456789abcdef
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SubmissionFile"

    SubmissionAccepted:
      type: object
      required: [submission_id]
      properties:
        submission_id:
          type: string
          example: exec_run_0123456789abcdef
        memory_update_status:
          type: string
          enum: [synced, failed]
          description: Best-effort profile maintenance outcome. The submission result is durable even when this is failed.

    SubmissionAcceptedEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/SubmissionAccepted"
        error:
          type: "null"

    SubmissionStatus:
      type: string
      enum: [pending, running, completed, error]

    Submission:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        result:
          $ref: "#/components/schemas/TestResult"

    TestResult:
      type: object
      required: [status, total, passed, failed, duration_ms, test_cases]
      properties:
        status:
          type: string
          enum: [pass, fail]
        total:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        test_cases:
          type: array
          items:
            $ref: "#/components/schemas/TestCaseResult"
        compile_error:
          type: string

    TestCaseResult:
      type: object
      required: [name, status, duration_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, fail]
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string

    SubmissionEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/Submission"
        error:
          type: "null"

    ExecutionStatus:
      type: string
      enum: [queued, running, passed, failed, error]

    ExecutionRun:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - language
        - entrypoint
        - status
        - output
        - duration_ms
        - created_at
      properties:
        id:
          type: string
          example: exec_run_0123456789abcdef
        workspace_id:
          type: string
        user_id:
          type: string
        problem_id:
          type: string
        language:
          type: string
        entrypoint:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        exit_code:
          type: integer
        output:
          type: string
        error:
          type: string
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    SubmitExecutionInput:
      type: object
      required: [problem_id, language, entrypoint, files]
      properties:
        problem_id:
          type: string
        language:
          type: string
        entrypoint:
          type: string
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SubmissionFile"

    ExecutionRunEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/ExecutionRun"
        error:
          type: "null"

    ExecutionRunsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionRun"
        error:
          type: "null"

    GenerateInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [mcq, problem, interview]
          description: MCQ and problem are implemented; interview uses the chat API.
        spec:
          oneOf:
            - $ref: "#/components/schemas/MCQSpec"
            - $ref: "#/components/schemas/ProblemGenerationSpec"
        intake_id:
          type: string
          description: Optional completed intake in the caller's workspace. Its self-report remains separate from demonstrated memory.
        operation_id:
          type: string
          description: Optional scoped workflow operation receiving deterministic MCQ progress events.

    PreparePracticeIntakeInput:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 500
          description: Original user-entered practice topic. The server derives an exact normalized topic identity.
        practice_seed:
          type: object
          additionalProperties: true
          description: Original New Practice choices retained for resume and generation context.
        restart:
          type: boolean
          default: false
          description: Creates a fresh pending intake even when this topic was previously completed or skipped.

    UpdatePracticeIntakeInput:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
          description: Question ID to option ID updates; each supplied option is validated.
        status:
          type: string
          enum: [pending, completed, skipped]

    PracticeIntakeOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    PracticeIntakeQuestion:
      type: object
      required: [id, dimension, text, options]
      properties:
        id:
          type: string
        dimension:
          type: string
        text:
          type: string
        options:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: "#/components/schemas/PracticeIntakeOption"

    PracticeIntake:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - normalized_topic
        - original_topic
        - practice_seed
        - questions
        - answers
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        user_id:
          type: string
        normalized_topic:
          type: string
        original_topic:
          type: string
        practice_seed:
          type: object
          additionalProperties: true
        questions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/PracticeIntakeQuestion"
        answers:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [pending, completed, skipped]
        suppression_reason:
          type: string
        generation_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    PracticeIntakeEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/PracticeIntake"
        error:
          type: "null"

    PracticeIntakeListEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PracticeIntake"
        error:
          type: "null"

    MCQSpec:
      type: object
      description: The model chooses single-select, multi-select, or free-response independently for each generated question.
      properties:
        topic:
          type: string
          description: Coarse topic; empty spreads questions across growth edges.
          example: hash tables
        prompt:
          type: string
          maxLength: 500
          description: The user's free-text "what do you want to study?" ask; steers concept selection together with memory notes.
          example: I want to drill Go concurrency patterns
        count:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        difficulty:
          type: string
          example: medium
        round:
          type: integer
          minimum: 0
          description: Round number in a continuous marathon; later rounds avoid repeating earlier questions.
    MaintainProfileInput:
      type: object
      properties:
        session_id:
          type: string
          description: Highlights the just-completed practice set inside the bounded cross-session evidence digest.
          example: mcq_abc123_r2
        operation_id:
          type: string
          description: Optional scoped memory_reflection or mcq_next_round workflow operation.

    WorkflowKind:
      type: string
      enum: [mcq_generation, memory_reflection, mcq_next_round]

    WorkflowStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    CreateWorkflowOperationInput:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/WorkflowKind"

    WorkflowOperation:
      type: object
      required:
        [id, workspace_id, user_id, kind, status, last_sequence, created_at, updated_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        user_id:
          type: string
        kind:
          $ref: "#/components/schemas/WorkflowKind"
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        last_sequence:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    WorkflowProgressEvent:
      type: object
      required: [operation_id, sequence, step_id, label, status, timestamp]
      properties:
        operation_id:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 1
        step_id:
          type: string
          description: Stable backend-owned product step identifier.
        label:
          type: string
          description: Backend-owned user-facing product step label.
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          description: Allowlisted safe scalar metadata only. terminal=true identifies the final event.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    WorkflowCreateResult:
      type: object
      required: [operation, events]
      properties:
        operation:
          $ref: "#/components/schemas/WorkflowOperation"
        events:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowProgressEvent"

    WorkflowCreateEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/WorkflowCreateResult"
        error:
          type: "null"

    WorkflowCancelResult:
      type: object
      required: [operation, event]
      properties:
        operation:
          $ref: "#/components/schemas/WorkflowOperation"
        event:
          $ref: "#/components/schemas/WorkflowProgressEvent"

    WorkflowCancelEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/WorkflowCancelResult"
        error:
          type: "null"

    MCQQuestion:
      type: object
      required: [id, type, text, concept, helpContent]
      properties:
        id:
          type: string
          example: mq1
        type:
          type: string
          enum: [single_select, multi_select, free_response]
        text:
          type: string
        options:
          type: array
          items:
            type: string
          maxItems: 4
          description: Exactly four options for single-select and multi-select; omitted for free response.
        correctIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Required only for single-select.
        correctIndices:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 3
          description: Required only for multi-select; grading requires an exact set match.
        expectedAnswer:
          type: string
          description: Concise evaluator reference answer for free-response items.
        rubric:
          type: string
          description: Objective binary grading criteria for free-response items.
        concept:
          type: string
        helpContent:
          type: string

    FreeResponseEvaluationInput:
      type: object
      required: [question, expected_answer, rubric, answer]
      properties:
        question_id:
          type: string
        question:
          type: string
        concept:
          type: string
        expected_answer:
          type: string
        rubric:
          type: string
        answer:
          type: string
          maxLength: 2000

    FreeResponseEvaluation:
      type: object
      required: [correct, feedback]
      properties:
        correct:
          type: boolean
        feedback:
          type: string
          maxLength: 400
        provider:
          type: string
        model:
          type: string

    FreeResponseEvaluationEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/FreeResponseEvaluation"
        error:
          type: "null"

    GenerateMCQResult:
      type: object
      required: [kind, questions, provider, model]
      properties:
        kind:
          type: string
          example: mcq
        questions:
          type: array
          items:
            $ref: "#/components/schemas/MCQQuestion"
        provider:
          type: string
          example: openai_compat
        model:
          type: string
          example: anthropic/claude-haiku-4.5

    GenerateMCQEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/GenerateMCQResult"
        error:
          type: "null"

    ProblemGenerationSpec:
      type: object
      properties:
        topic:
          type: string
          maxLength: 500
        prompt:
          type: string
          maxLength: 500
        difficulty:
          type: string
          enum: [easy, medium, hard]

    GenerateProblemResult:
      type: object
      required: [kind, problem_id, problem, provider, model]
      properties:
        kind:
          type: string
          enum: [problem]
        problem_id:
          type: string
        problem:
          $ref: "#/components/schemas/Problem"
        provider:
          type: string
        model:
          type: string

    GenerateProblemEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: "#/components/schemas/GenerateProblemResult"
        error:
          type: "null"

    JsonValue:
      oneOf:
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: "null"

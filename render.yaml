# Render Blueprint for the CodeGym backend API.
#
# This codifies the service already running manually at
# https://codegym.onrender.com so it can be reproduced (or adopted) via
# Render's "Blueprints" flow. See docs/render-deploy.md for how to apply it
# and which values you must fill in by hand.
#
# Spec reference: https://render.com/docs/blueprint-spec
# (fetched via WebFetch during authoring: request returned HTTP 403 through
# the sandboxed proxy, so field names below are from prior knowledge of the
# Blueprint spec, not a live re-check. Recommended: dry-run the blueprint
# in the Render dashboard preview before syncing, since it will flag any
# unrecognized keys.)

services:
  - type: web
    name: codegym-backend
    runtime: go
    plan: free # Render free web services spin down after 15 min idle and
      # spin back up (cold start) on the next request. Upgrade to
      # `starter` (or higher) for always-on, more CPU/RAM, and no
      # cold starts once this needs to be production-reliable.
    region: oregon
    branch: codegym-v2 # auto-deploy tracks this branch; see docs/render-deploy.md
    autoDeploy: true
    rootDir: backend
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically; the app reads CODEGYM_PORT and
      # falls back to PORT, so no port variable needs to be set here.
      - key: CODEGYM_HOST
        value: 0.0.0.0 # required: Go's default (127.0.0.1) is not reachable
        # from Render's edge/proxy layer.

      # --- Database (Neon Postgres) ---
      - key: NEON_CONNECTION_STRING
        sync: false # secret; already set by hand in the Render dashboard.

      # --- Auth0 ---
      - key: CODEGYM_AUTH_MODE
        value: auth0
      - key: CODEGYM_AUTH0_DOMAIN
        sync: false # secret/dashboard-managed, e.g. your-tenant.us.auth0.com
      - key: CODEGYM_AUTH0_AUDIENCE
        sync: false # secret/dashboard-managed, e.g. https://codegym-api

      # --- CORS ---
      - key: CODEGYM_CORS_ALLOWED_ORIGINS
        # Exact origins and one-label wildcards are supported. This allows the
        # production alias plus Vercel preview URLs for Kevin's project scope.
        value: https://code-gym-rho.vercel.app,https://*-kvn8888s-projects.vercel.app

      # --- GenAI (Gemini native Interactions API) ---
      - key: CODEGYM_GENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: CODEGYM_GENAI_API_KEY
        sync: false # secret Gemini API key; set by hand in Render.
      - key: CODEGYM_GENAI_MODEL
        value: gemini-3.5-flash

      # Optional (not set here; see docs/render-deploy.md):
      #   CODEGYM_MEMORY_WORKER_DISABLED
      #   CODEGYM_MEMORY_WORKER_INTERVAL

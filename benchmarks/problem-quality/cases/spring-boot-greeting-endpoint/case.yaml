case_id: spring-boot-greeting-endpoint
version: 1.0.0
technology: spring-boot
objective: Implement a Spring Boot REST endpoint that accepts a name query parameter and returns a JSON greeting.

environment_manifest: environment/manifest.json

build_test_run:
  strategy: http
  entrypoint: src/main/java/com/codegym/exercise/GreetingController.java
  commands:
    setup: mvn -q dependency:go-offline
    build: mvn -q test-compile
    test: mvn -q test
    run: mvn -q spring-boot:run
  limits:
    timeout_seconds: 300
    memory_mb: 512
    network_mode: setup-only

spec:
  path_or_inline: spec.json
  ambiguity_resolutions_required: true

correct_alternatives:
  - id: alt-01
    files:
      src/main/java/com/codegym/exercise/GreetingController.java: correct/alt-01/GreetingController.java
    reviewed_by: reviewer
    reviewed_at: "2026-11-11T00:00:00Z"

wrong_solutions:
  - id: missing-name-validation
    files:
      src/main/java/com/codegym/exercise/GreetingController.java: wrong/missing-name-validation/GreetingController.java
    intended_failure:
      test_id: hidden-missing-name
      code: HTTP_STATUS
      expected: "400"
      actual: "200"
      reason: "The endpoint does not reject a missing or blank name."
    learning_objective_rationale: "A learner may forget to validate required request input."
    reviewed_by: reviewer
    reviewed_at: "2026-11-11T00:00:00Z"
    denominator_decision: meaningful
  - id: wrong-response-field
    files:
      src/main/java/com/codegym/exercise/GreetingController.java: wrong/wrong-response-field/GreetingController.java
    intended_failure:
      test_id: hidden-response-shape
      code: JSON_FIELD
      expected: "message"
      actual: "greeting"
      reason: "The response uses the wrong JSON field name."
    learning_objective_rationale: "A learner may return a plausible but non-contract field name."
    reviewed_by: reviewer
    reviewed_at: "2026-11-11T00:00:00Z"
    denominator_decision: meaningful

comparator_expectations:
  default:
    kind: exact
  case_overrides_allowed: true
  notes: "Exact status code and exact JSON field/value comparison for the greeting response."

expected_outcomes:
  generation:
    blind_agreement: null
    reconciliation_count: null
    reconciliation_direction: null
    non_convergence: null
    status: not_applicable
  assessment:
    correct_alternatives_pass: true
    wrong_solutions_rejected: true

review:
  reviewed_by: reviewer
  reviewed_at: "2026-11-11T00:00:00Z"
  ambiguous_spec: false
  notes: "HTTP regression case for Spring Boot request handling and JSON response shape."
